[project]
name = "bbl-simple-agent"
version = "0.1.0"
description = "Hotel Californian RAG assistant with Data Retriever and Report Generator agents built using LangChain and LangGraph."
readme = "README.md"
authors = [
    { name = "ryuinw123", email = "romtham.thang@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2",
    "langchain-community",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
bbl-simple-agent = "bbl_simple_agent.agent:main"

[tool.uv.build-backend]
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
